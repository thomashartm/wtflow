name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        toolchain: [1.80.1, stable]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt --component clippy
      - run: cargo +${{ matrix.toolchain }} fmt --all --check
      - run: cargo +${{ matrix.toolchain }} clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +${{ matrix.toolchain }} test --workspace --locked
      - run: cargo +${{ matrix.toolchain }} build --locked -p wtflow-cli
      - run: scripts/check-goldens.sh
      - name: Validate Mermaid syntax
        if: matrix.toolchain == 'stable'
        run: scripts/check-mermaid.sh
  release-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.80.1 --profile minimal --target ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: make release TARGET=${{ matrix.target }}
      - run: target/${{ matrix.target }}/release/wtflow version
      - uses: actions/upload-artifact@v4
        with:
          name: wtflow-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/wtflow
