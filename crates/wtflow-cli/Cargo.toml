[package]
name = "wtflow-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
crossterm.workspace = true
ratatui = "=0.28.1"
# Keep the TUI dependency graph compatible with Rust 1.80.
instability = "=0.3.1"
unicode-segmentation = "=1.12.0"
shell-words = "=1.1.0"
libc = "=0.2.169"
tempfile.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
tree-sitter.workspace = true
walkdir.workspace = true
wtflow-core = {path = "../wtflow-core"}
wtflow-extract = {path = "../wtflow-extract"}
wtflow-render = {path = "../wtflow-render"}
wtflow-resolve = {path = "../wtflow-resolve"}

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "wtflow"
path = "src/main.rs"
